<svg viewBox="0 0 680 600" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>P1 main.py 调用关系图（精确版）</title>
<desc>入口守卫调用 main，main 总线分发到四个命令；ingest 依次调用加载、切分、嵌入、存储写入 Milvus；ask 依次调用嵌入、加载向量库、构建模型、构建 RAG 链；demo 走完整流程；list 直接读文件并检查 Milvus collection</desc>
<style>
.t{font:500 13px sans-serif;fill:#085041;text-anchor:middle}
.ts{font:400 11px sans-serif;fill:#0F6E56;text-anchor:middle}
.tg{font:400 11px sans-serif;fill:#5F5E5A;text-anchor:middle}
.h{font:500 14px sans-serif;fill:#2C2C2A;text-anchor:middle}
.nA{fill:#9FE1CB;stroke:#0F6E56;stroke-width:1}
.nB{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.nC{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.edge{stroke:#0F6E56;stroke-width:1.2;fill:none;marker-end:url(#arrow)}
.edgeD{stroke:#0F6E56;stroke-width:1.2;fill:none;stroke-dasharray:4 3;marker-end:url(#arrow)}
.edgeG{stroke:#5F5E5A;stroke-width:1.2;fill:none;marker-end:url(#arrow)}
.bg{fill:#ffffff}
.layer{fill:none;stroke:#B0B0B0;stroke-width:1.2;stroke-dasharray:6 3}
.badge{font:500 11px sans-serif;fill:#666}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

