<svg viewBox="0 0 680 588" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>P2 main.py 调用关系图</title>
<desc>入口守卫调用 main，main 分发到 demo 与 cmd_agent；demo 内部依次执行 bind_tools 演示、手动循环演示、调用 cmd_agent；cmd_agent 调用 build_agent，build_agent 用 create_agent 构建 Agent，共享 build_model 与 TOOLS 工具清单，外部依赖 DeepSeek API 与 .env</desc>
<style>
.t{font:500 13px sans-serif;fill:#633806;text-anchor:middle}
.ts{font:400 11px sans-serif;fill:#854F0B;text-anchor:middle}
.tg{font:400 11px sans-serif;fill:#5F5E5A;text-anchor:middle}
.h{font:500 14px sans-serif;fill:#2C2C2A;text-anchor:middle}
.nA{fill:#FAC775;stroke:#BA7517;stroke-width:1}
.nB{fill:#FAEEDA;stroke:#BA7517;stroke-width:1}
.nC{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.edge{stroke:#BA7517;stroke-width:1.2;fill:none;marker-end:url(#arrow)}
.edgeG{stroke:#5F5E5A;stroke-width:1.2;fill:none;marker-end:url(#arrow)}
.bg{fill:#ffffff}
.layer{fill:none;stroke:#B0B0B0;stroke-width:1.2;stroke-dasharray:6 3}
.badge{font:500 11px sans-serif;fill:#666}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

