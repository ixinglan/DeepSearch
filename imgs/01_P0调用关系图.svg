<svg viewBox="0 0 680 600" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>P0 main.py 调用关系图（精确版）</title>
<desc>入口守卫调用 main，main 总线分发到五个命令；chat 调用 build_model，translate、summarize、polish 分别调用模块加载时构建的三条链，demo 内部依次执行四个演示步骤；链由 prompt、model、parser 组成，外部依赖 .env 与模型 API</desc>
<style>
.t{font:500 13px sans-serif;fill:#0C447C;text-anchor:middle}
