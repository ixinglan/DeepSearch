.nB{fill:#E6F1FB;stroke:#185FA5;stroke-width:1}
.nC{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.edge{stroke:#185FA5;stroke-width:1.2;fill:none;marker-end:url(#arrow)}
.edgeD{stroke:#185FA5;stroke-width:1.2;fill:none;stroke-dasharray:4 3;marker-end:url(#arrow)}
.edgeG{stroke:#5F5E5A;stroke-width:1.2;fill:none;marker-end:url(#arrow)}
.bg{fill:#ffffff}
.layer{fill:none;stroke:#B0B0B0;stroke-width:1.2;stroke-dasharray:6 3}
.badge{font:500 11px sans-serif;fill:#666}
</style>
